services:
  - type: web
    name: varia-carbon-api
    runtime: python
    plan: free
    branch: develop
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
